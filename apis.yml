name: Hi Health
description: >-
  Hi Health (hi.health) is a European digital-health payments company, originally a Speedinvest
  portfolio company, now operating as "hi.health by Pliant". The hi.health domain redirects to
  Pliant, and the product replaces legacy insurance reimbursement with a cashless, real-time
  claims-and-payments platform for health & care, home & property, travel, corporate/group, and
  auto/mobility insurance. It is built on Pliant's card-issuing infrastructure and exposed through
  Pliant's Pro API (Customer): a REST API for issuing and managing virtual and physical credit
  cards, cardholders, card accounts, transactions, receipts, accounting integration, and payments,
  with OAuth 2.0 (Auth0) client-credentials authentication, asynchronous callback webhooks, a
  sandbox environment, PCI-DSS certified sensitive-card-data endpoints, and a hosted developer
  portal, changelog, and status page.
