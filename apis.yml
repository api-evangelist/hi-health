apis:
- name: Pliant Pro API (Customer)
  description: >-
    Pliant's Pro API (Customer) is the REST API that powers hi.health by Pliant. It lets a customer
    programmatically access Pliant credit-card data and features: issue and manage virtual and
    physical cards, manage cardholders and card accounts, retrieve and categorize transactions,
    upload and convert receipts, integrate accounting (custom fields, projects, teams), and access
    payments and statements. Mutating operations are asynchronous and confirmed via callbacks;
    PCI-DSS certified endpoints on pci-api.getpliant.com return sensitive card data.
  humanURL: https://customer-api.getpliant.com
  baseURL: https://partner-api.getpliant.com/api/
